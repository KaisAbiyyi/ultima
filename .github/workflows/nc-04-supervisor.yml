name: NC-04 Rust App Server supervisor
on:
  pull_request:
    paths:
      - "crates/app-server-supervisor/**"
      - ".github/workflows/nc-04-supervisor.yml"
  push:
    paths:
      - "crates/app-server-supervisor/**"
      - ".github/workflows/nc-04-supervisor.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supervisor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/app-server-supervisor
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile and lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Synthetic lifecycle and security tests
        run: cargo test --all-targets
