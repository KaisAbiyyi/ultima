name: NC-05 bounded Rust protocol adapter
on:
  push:
    paths:
      - 'tests/fixtures/nc10g-*.json'
      - "crates/protocol-bridge/**"
      - ".github/workflows/nc-05-adapter.yml"
  pull_request:
    paths:
      - 'tests/fixtures/nc10g-*.json'
      - "crates/protocol-bridge/**"
      - ".github/workflows/nc-05-adapter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter:
    name: Rust adapter tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/protocol-bridge/Cargo.toml --all --check
      - name: Unit and replay tests
        run: cargo test --manifest-path crates/protocol-bridge/Cargo.toml --all-targets
      - name: Lint
        run: cargo clippy --manifest-path crates/protocol-bridge/Cargo.toml --all-targets -- -D warnings
