name: NC-08 bounded UI & event lifecycle
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'package.json'
      - '.github/workflows/nc-08-bounded-ui.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - '.github/workflows/nc-08-bounded-ui.yml'
  workflow_dispatch:
jobs:
  bounded-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
