name: NC-10 qualification tooling (not physical Windows acceptance)
on:
  pull_request:
    paths: ['scripts/nc-10-*', 'tests/nc-10-*', 'src/lib/native-performance*', 'src/Desktop.svelte', 'src-tauri/**', 'package*.json', '.github/workflows/nc-10-native-qualification.yml']
  push:
    branches: [main]
    paths: ['scripts/nc-10-*', 'tests/nc-10-*', 'src/lib/native-performance*', 'src/Desktop.svelte', 'src-tauri/**', 'package*.json', '.github/workflows/nc-10-native-qualification.yml']
  workflow_dispatch:
jobs:
  tooling-and-native-build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - run: npm run test:native-evidence
      - run: npm run check
      - run: npm test
      - run: npx tauri build --no-bundle -- --locked
      - run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
