name: NC-12 managed runtime + rollback
on:
  pull_request:
    paths:
      - "crates/runtime-manager/**"
      - "crates/app-server-supervisor/**"
      - "protocol/compat-matrix.json"
      - ".github/workflows/nc-12-runtime-manager.yml"
  push:
    paths:
      - "crates/runtime-manager/**"
      - "crates/app-server-supervisor/**"
      - "protocol/compat-matrix.json"
      - ".github/workflows/nc-12-runtime-manager.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/runtime-manager
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check committed Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile and lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Synthetic security, offline and rollback tests
        run: cargo test --all-targets
