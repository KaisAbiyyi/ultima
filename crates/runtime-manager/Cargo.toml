[package]
name = "ultima-runtime-manager"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros"] }
ultima-app-server-supervisor = { path = "../app-server-supervisor" }

[dev-dependencies]
tempfile = "3"
