[package]
name = "ultima-native-renderer-spike"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

# Experimental native UI with an opt-in, bounded official Codex read-only turn path.
# eframe 0.33.3 is compatible with our Rust 1.91.1 toolchain.
[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
ultima-app-server-supervisor = { path = "../../crates/app-server-supervisor" }
ultima-protocol-bridge = { path = "../../crates/protocol-bridge" }
ultima-native-session = { path = "../../crates/native-session" }
ultima-runtime-manager = { path = "../../crates/runtime-manager" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

