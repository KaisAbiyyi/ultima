[package]
name = "ultima-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
serde_json = "1"
ultima-app-server-supervisor = { path = "../crates/app-server-supervisor" }
ultima-protocol-bridge = { path = "../crates/protocol-bridge" }
ultima-runtime-manager = { path = "../crates/runtime-manager" }
